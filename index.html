<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Rewards App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 9:16 Mobile Container */
        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 896px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Scrollbar hide for clean look */
        .mobile-container::-webkit-scrollbar {
            display: none;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            color: #fff;
            font-size: 12px;
        }

        .wallet-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #facc15;
            padding: 6px 12px;
            border-radius: 20px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
        }

        .app-title {
            text-align: center;
            color: #facc15;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin: 5px 0;
        }

        /* Main Content Area */
        .content {
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Daily Bonus Card */
        .daily-bonus {
            flex: 1;
            background: linear-gradient(to bottom, #ffffff, #f0fdf4);
            border: 2px solid #22c55e;
        }

        .daily-bonus h3 {
            font-size: 13px;
            color: #15803d;
            margin-bottom: 5px;
        }

        .btn-claim {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Watch Ads Card */
        .watch-ads {
            flex: 1;
            background: linear-gradient(to bottom, #ffffff, #eff6ff);
            border: 2px solid #3b82f6;
        }

        .watch-ads h3 {
            font-size: 13px;
            color: #1d4ed8;
            margin-bottom: 5px;
        }

        .btn-watch {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Play & Win Section */
        .play-win {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #a855f7;
        }

        .play-win h3 {
            font-size: 13px;
            color: #7e22ce;
            margin-bottom: 8px;
            text-align: center;
        }

        .games-grid {
            display: flex;
            justify-content: space-around;
            gap: 5px;
        }

        .mini-game {
            background: #f3e8ff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #6b21a8;
            flex: 1;
            text-align: center;
        }

        /* Extra Tasks Section */
        .extra-tasks {
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #f97316;
        }

        .extra-tasks h3 {
            font-size: 13px;
            color: #c2410c;
            margin-bottom: 8px;
            text-align: center;
        }

        .tasks-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .task-item {
            min-width: 90px;
            background: #ffedd5;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            border: 1px solid #fdba74;
        }

        .task-item p {
            font-size: 10px;
            font-weight: 600;
            color: #9a3412;
            margin-bottom: 4px;
        }

        .task-item span {
            font-size: 9px;
            background: #ea580c;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Withdraw Button */
        .withdraw-container {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .btn-withdraw {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 10px 0;
            color: #94a3b8;
            font-size: 11px;
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
        }

        .nav-item.active {
            color: #facc15;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Header -->
        <div>
            <div class="header">
                <div class="profile-box">
                    <span>👤 Profile</span>
                    <small>ID: 10001</small>
                </div>
                <div class="wallet-box">
                    <span>🪙</span> <span id="coin-count">21,500</span>
                </div>
            </div>
            <div class="app-title">DREAM REWARDS</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Row 1: Daily Bonus & Watch Ads -->
            <div class="row">
                <div class="card daily-bonus">
                    <h3>DAILY BONUS</h3>
                    <p style="font-size:10px; color:#666;">Claim 50 Coins</p>
                    <button class="btn-claim" onclick="claimBonus()">Claim</button>
                </div>
                <div class="card watch-ads">
                    <h3>WATCH ADS</h3>
                    <p style="font-size:10px; color:#666;">Earn 10 Coins</p>
                    <button class="btn-watch" onclick="watchAd()">Watch</button>
                </div>
            </div>

            <!-- Play & Win Mini Games -->
            <div class="play-win">
                <h3>🎮 PLAY & WIN</h3>
                <div class="games-grid">
                    <div class="mini-game">🎡 Spin Wheel</div>
                    <div class="mini-game">🧩 Math Quiz</div>
                    <div class="mini-game">🏆 Leaderboard</div>
                </div>
            </div>

            <!-- Extra Tasks Section -->
            <div class="extra-tasks">
                <h3>🔥 EXTRA TASKS</h3>
                <div class="tasks-scroll">
                    <div class="task-item">
                        <p>Download App</p>
                        <span>+100 Coins</span>
                    </div>
                    <div class="task-item">
                        <p>Take Survey</p>
                        <span>+150 Coins</span>
                    </div>
                    <div class="task-item">
                        <p>Invite Friend</p>
                        <span>+200 Coins</span>
                    </div>
                    <div class="task-item">
                        <p>Play Quiz</p>
                        <span>+50 Coins</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Actions -->
        <div>
            <div class="withdraw-container">
                <button class="btn-withdraw" onclick="alert('Withdrawal request submitted!')">WITHDRAW COINS ⬆</button>
            </div>
            <div class="bottom-nav">
                <div class="nav-item active">🏠 Home</div>
                <div class="nav-item">🎮 Games</div>
                <div class="nav-item">🎁 Offers</div>
                <div class="nav-item">👛 Wallet</div>
            </div>
        </div>

    </div>

    <!-- Simple JavaScript for Interactive Coins -->
    <script>
        let coins = 21500;

        function updateCoins(amount) {
            coins += amount;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function claimBonus() {
            alert("50 Coins added to your wallet!");
            updateCoins(50);
        }

        function watchAd() {
            alert("Ad watched successfully! 10 Coins added.");
            updateCoins(10);
        }
    </script>

</body>
</html>
