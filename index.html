<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bishal Pro Reward Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07112d;
  color:white;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:110px;
}

/* HEADER */
header{
  background:#101d40;
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #ffd52e;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  background:#263966;
}

.name{
  font-size:18px;
  font-weight:bold;
}

.id{
  color:#9daac5;
  margin-top:5px;
  font-size:13px;
}

.wallet{
  margin-left:auto;
  background:#101a35;
  border:1px solid #766b29;
  padding:11px 15px;
  border-radius:30px;
  font-weight:bold;
}

/* CONTENT */
.content{
  padding:18px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#377aff,#2353d0);
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 15px 35px #0005;
}

.hero h1{
  font-size:24px;
  margin-bottom:8px;
}

.hero p{
  color:#dce7ff;
  margin-bottom:15px;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  background:#1550bd;
  padding:8px 11px;
  border-radius:9px;
  font-size:13px;
}

/* CARDS */
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  background:#14223b;
  border:1px solid #293a5c;
  border-radius:20px;
  padding:18px;
}

.icon{
  font-size:38px;
  text-align:center;
}

.card h3{
  text-align:center;
  margin:8px 0;
}

.card p{
  text-align:center;
  color:#9daac5;
}

button{
  border:none;
  cursor:pointer;
  color:white;
}

.btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  background:#3475f4;
  font-weight:bold;
  font-size:15px;
}

.green{
  background:#20c968;
}

.dark{
  background:#263755;
}

/* SECTIONS */
.section{
  margin-top:25px;
}

.title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

/* GAMES */
.games{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.game{
  background:#14223b;
  border:1px solid #293a5c;
  border-radius:18px;
  padding:15px 5px;
  min-height:120px;
}

.game-icon{
  font-size:30px;
}

.game b{
  display:block;
  margin-top:8px;
  font-size:13px;
}

.game small{
  color:#8998b5;
}

/* TASKS */
.tasks{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.task{
  background:#14223b;
  border:1px solid #293a5c;
  border-radius:18px;
  padding:17px 5px;
  text-align:center;
}

.reward{
  display:inline-block;
  background:#40351d;
  color:#ffd33d;
  padding:6px 8px;
  margin-top:8px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:760px;
  margin:auto;
  padding:12px 18px;
  background:#07112d;
  z-index:50;
}

.withdraw{
  width:100%;
  padding:16px;
  border-radius:16px;
  background:#20c968;
  font-size:18px;
  font-weight:bold;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#0d1932;
  border-radius:25px 25px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  background:#263755;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
}

.input{
  width:100%;
  padding:14px;
  background:#09142b;
  border:1px solid #34486d;
  border-radius:12px;
  color:white;
  margin-top:7px;
  outline:none;
}

/* WHEEL */
.wheel-area{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.wheel-box{
  position:relative;
  margin:20px;
}

.pointer{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:0;
  border-bottom:28px solid #ff5364;
  z-index:3;
}

.wheel{
  width:280px;
  height:280px;
  border-radius:50%;
  border:8px solid #f5d347;

  background:conic-gradient(
    #3475f4 0deg 72deg,
    #ff5364 72deg 144deg,
    #20c968 144deg 216deg,
    #995bff 216deg 288deg,
    #ffb928 288deg 360deg
  );

  transition:transform 4s cubic-bezier(.12,.76,.17,1);
  box-shadow:0 12px 30px #0008;
}

.wheel-values{
  display:flex;
  gap:6px;
}

.wheel-values span{
  background:#192843;
  padding:8px;
  border-radius:8px;
  font-weight:bold;
}

/* QUIZ */
.question{
  font-size:28px;
  text-align:center;
  font-weight:bold;
  margin:25px 0;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  background:#1b2b49;
  padding:15px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}

.correct{
  background:#0c9550 !important;
}

.wrong{
  background:#bd394b !important;
}

.status{
  text-align:center;
  margin:15px 0;
  font-weight:bold;
  min-height:25px;
}

/* HISTORY */
.row{
  display:flex;
  justify-content:space-between;
  background:#14223b;
  padding:13px;
  border-radius:11px;
  margin-top:8px;
}

/* CONFETTI */
.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
}

.confetti i{
  position:absolute;
  width:8px;
  height:15px;
  animation:fall 1.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(720deg);
    opacity:0;
  }
}

/* MOBILE */
@media(max-width:500px){

  .games{
    grid-template-columns:repeat(4,1fr);
  }

  .game{
    min-height:110px;
  }

  .game-icon{
    font-size:26px;
  }

  .hero h1{
    font-size:21px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="avatar">BP</div>

<div>
<div class="name">Bishal_Pro 👑</div>
<div class="id">ID: 10001</div>
</div>

<div class="wallet">
🪙 <span id="coins">21,500</span>
</div>

</header>


<div class="content">

<!-- HERO -->

<div class="hero">

<h1>PLAY • EARN • REWARDS</h1>

<p>
Play games, complete tasks and collect virtual coins.
</p>

<div class="badges">

<div class="badge">🛡️ Demo Safe</div>

<div class="badge">⚡ Fast Updates</div>

<div class="badge">🎁 Daily Rewards</div>

</div>

</div>


<!-- DAILY / ADS -->

<div class="grid2">

<div class="card">

<div class="icon">🎁</div>

<h3>DAILY BONUS</h3>

<p id="bonusText">
Claim 50 Coins
</p>

<button
id="bonusButton"
class="btn green"
onclick="claimBonus()">

CLAIM NOW

</button>

</div>


<div class="card">

<div class="icon">🎬</div>

<h3>WATCH ADS</h3>

<p>
Earn 10 Coins
</p>

<button
class="btn"
onclick="watchAd()">

WATCH NOW

</button>

</div>

</div>


<!-- GAMES -->

<div class="section">

<div class="title">
🎮 PLAY & WIN
</div>

<div class="games">

<button class="game" onclick="openWheel()">

<div class="game-icon">🎡</div>

<b>Spin Wheel</b>

<small>Win Coins</small>

</button>


<button class="game" onclick="openQuiz()">

<div class="game-icon">🧠</div>

<b>Math Quiz</b>

<small>Unlimited</small>

</button>


<button class="game" onclick="rankings()">

<div class="game-icon">🏆</div>

<b>Rankings</b>

<small>Top Wins</small>

</button>


<button class="game" onclick="luckyCard()">

<div class="game-icon">🎟️</div>

<b>Lucky Card</b>

<small>Win 1000</small>

</button>

</div>

</div>


<!-- TASKS -->

<div class="section">

<div class="title">
🔥 EXTRA TASKS
</div>

<div class="tasks">

<button class="task" onclick="task('Download',100)">

<div class="game-icon">⬇️</div>

<b>Download</b>

<div class="reward">
+100 Coins
</div>

</button>


<button class="task" onclick="task('Survey',150)">

<div class="game-icon">📊</div>

<b>Survey</b>

<div class="reward">
+150 Coins
</div>

</button>


<button class="task" onclick="referral()">

<div class="game-icon">👥</div>

<b>Invite</b>

<div class="reward">
+200 Coins
</div>

</button>

</div>

</div>


<!-- ACTIVITY -->

<div class="section">

<div class="card">

<h3>📈 Recent Activity</h3>

<div id="history"></div>

</div>

</div>

</div>


<!-- BOTTOM -->

<div class="bottom">

<button
class="withdraw"
onclick="withdraw()">

💳 WITHDRAW COINS

</button>

</div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="sheet" id="sheet">

</div>

</div>


<div class="confetti" id="confetti"></div>


<script>

/* =========================
   DATA
========================= */

let coins =
Number(localStorage.getItem("coins")) || 21500;

let lastBonus =
localStorage.getItem("lastBonus") || "";

let referralCode =
localStorage.getItem("referralCode") ||
"BP10001";

let history =
JSON.parse(localStorage.getItem("history") || "[]");


/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(
"coins",
coins
);

localStorage.setItem(
"lastBonus",
lastBonus
);

localStorage.setItem(
"referralCode",
referralCode
);

localStorage.setItem(
"history",
JSON.stringify(history)
);

render();

}


/* =========================
   RENDER
========================= */

function render(){

document.getElementById(
"coins"
).innerText =
coins.toLocaleString("en-IN");


let today =
new Date().toISOString().slice(0,10);

let button =
document.getElementById(
"bonusButton"
);

if(lastBonus === today){

button.innerText =
"CLAIMED TODAY";

button.disabled=true;

document.getElementById(
"bonusText"
).innerText =
"Come back tomorrow";

}else{

button.innerText =
"CLAIM NOW";

button.disabled=false;

}


let h =
document.getElementById(
"history"
);

h.innerHTML="";

history.slice(0,5).forEach(x=>{

h.innerHTML += `

<div class="row">

<span>
${x.icon} ${x.text}
</span>

<b>
${x.amount > 0 ? "+" : ""}
${x.amount}
</b>

</div>

`;

});

}


/* =========================
   ADD COINS
========================= */

function addCoins(
amount,
text,
icon="🪙"
){

coins += amount;

history.unshift({

amount:amount,

text:text,

icon:icon,

time:new Date().toLocaleString()

});

history =
history.slice(0,50);

save();

}


/* =========================
   DAILY BONUS
========================= */

function claimBonus(){

let today =
new Date().toISOString().slice(0,10);

if(lastBonus === today){

alert(
"Daily bonus already claimed!"
);

return;

}

lastBonus=today;

addCoins(
50,
"Daily Bonus",
"🎁"
);

alert(
"🎉 You received 50 coins!"
);

}


/* =========================
   WATCH AD
========================= */

function watchAd(){

openModal(

"🎬 Watch & Earn",

`

<p style="color:#9daac5;margin:15px 0">

Demo ad system. Real ad network can be connected later.

</p>

<div style="
height:150px;
background:#172945;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
">

▶️

</div>

<button
class="btn green"
onclick="
addCoins(10,'Watched Ad','🎬');
closeModal();
">

CLAIM +10 COINS

</button>

`

);

}


/* =========================
   SPIN WHEEL
========================= */

function openWheel(){

openModal(

"🎡 Spin Wheel",

`

<p style="
color:#9daac5;
text-align:center;
margin-top:10px
">

Rewards: 10 • 15 • 20 • 100 • 100 Coins

</p>

<div class="wheel-area">

<div class="wheel-box">

<div class="pointer"></div>

<div
id="wheel"
class="wheel">
</div>

</div>

<div class="wheel-values">

<span>10</span>
<span>15</span>
<span>20</span>
<span>100</span>
<span>100</span>

</div>

</div>

<div
id="spinResult"
class="status">
</div>

<button
id="spinButton"
class="btn green"
onclick="spin()">

🎡 SPIN NOW

</button>

`

);

}


function spin(){

let rewards =
[10,15,20,100,100];

let reward =
rewards[
Math.floor(
Math.random()*rewards.length
)
];

let wheel =
document.getElementById("wheel");

let rotation =
1440 +
Math.floor(
Math.random()*360
);

wheel.style.transform =
"rotate("+rotation+"deg)";

document.getElementById(
"spinButton"
).disabled=true;

setTimeout(()=>{

document.getElementById(
"spinResult"
).innerHTML =
"🎉 Congratulations! You won "+
reward+
" coins!";

addCoins(
reward,
"Spin Wheel",
"🎡"
);

celebrate();

document.getElementById(
"spinButton"
).disabled=false;

},4200);

}


/* =========================
   QUIZ
========================= */

let currentAnswer=0;

function openQuiz(){

showQuestion();

}


function showQuestion(){

let a =
Math.floor(Math.random()*40)+2;

let b =
Math.floor(Math.random()*20)+2;

let operators=[
"+",
"-",
"×"
];

let op =
operators[
Math.floor(
Math.random()*operators.length
)
];

if(op==="+")
currentAnswer=a+b;

if(op==="-")
currentAnswer=a-b;

if(op==="×")
currentAnswer=a*b;


let answers=[
currentAnswer,
currentAnswer+1,
currentAnswer-2,
currentAnswer+5
];

answers.sort(
()=>Math.random()-0.5
);


let buttons="";

answers.forEach(x=>{

buttons += `

<button
class="answer"
onclick="checkAnswer(
${x},
this
)">

${x}

</button>

`;

});


openModal(

"🧠 Math Quiz",

`

<div style="
text-align:center;
color:#ffd43b;
font-weight:bold;
">

🔥 Unlimited Questions

</div>

<div class="question">

${a} ${op} ${b} = ?

</div>

<div class="answers">

${buttons}

</div>

<div
id="quizStatus"
class="status">

</div>

`

);

}


function checkAnswer(
answer,
button
){

let all =
document.querySelectorAll(
".answer"
);

all.forEach(
x=>x.disabled=true
);


if(answer === currentAnswer){

button.classList.add(
"correct"
);

document.getElementById(
"quizStatus"
).innerHTML =
"🎉 CORRECT! AMAZING!";

addCoins(
20,
"Math Quiz",
"🧠"
);

celebrate();

setTimeout(
showQuestion,
1300
);

}else{

button.classList.add(
"wrong"
);

document.getElementById(
"quizStatus"
).innerHTML =
"❌ Wrong Answer — Try Again";

setTimeout(
showQuestion,
1200
);

}

}


/* =========================
   RANKINGS
========================= */

function rankings(){

openModal(

"🏆 Rankings",

`

<div class="row">
<span>🥇 Player_A</span>
<b>98,450</b>
</div>

<div class="row">
<span>🥈 Player_B</span>
<b>76,200</b>
</div>

<div class="row">
<span>🥉 Bishal_Pro</span>
<b>${coins.toLocaleString()}</b>
</div>

<div class="row">
<span>4️⃣ Player_D</span>
<b>31,800</b>
</div>

`

);

}


/* =========================
   LUCKY CARD
========================= */

function luckyCard(){

openModal(

"🎟️ Lucky Card",

`

<p style="
color:#9daac5;
margin:15px 0;
text-align:center
">

Pick one card

</p>

<div class="games">

<button
class="game"
onclick="winCard(this)">

<div style="font-size:45px">
🎴
</div>

CARD 1

</button>


<button
class="game"
onclick="winCard(this)">

<div style="font-size:45px">
🎴
</div>

CARD 2

</button>


<button
class="game"
onclick="winCard(this)">

<div style="font-size:45px">
🎴
</div>

CARD 3

</button>

</div>

`

);

}


function winCard(btn){

btn.innerHTML =
"🎉<br>+1000";

addCoins(
1000,
"Lucky Card",
"🎟️"
);

celebrate();

}


/* =========================
   TASK
========================= */

function task(
name,
amount
){

let key =
"task_"+name;

if(localStorage.getItem(key)){

alert(
name+
" task already completed."
);

return;

}

localStorage.setItem(
key,
"1"
);

addCoins(
amount,
name+" Task",
"🔥"
);

alert(
"🎉 +"+
amount+
" Coins"
);

}


/* =========================
   REFERRAL
========================= */

function referral(){

let link =
location.href.split("?")[0]+
"?ref="+
referralCode;

openModal(

"👥 Invite & Earn",

`

<p style="
color:#9daac5;
margin-top:15px
">

Your Referral Code

</p>

<div style="
background:#172945;
padding:15px;
border-radius:12px;
text-align:center;
font-size:24px;
font-weight:bold;
margin-top:8px;
">

${referralCode}

</div>

<p style="
color:#9daac5;
margin-top:15px
">

Your Referral Link

</p>

<input
id="refLink"
class="input"
readonly
value="${link}"
>

<button
class="btn"
onclick="copyReferral()">

📋 COPY LINK

</button>

<button
class="btn green"
onclick="whatsappShare()">

💬 SHARE ON WHATSAPP

</button>

`

);

}


function copyReferral(){

let input =
document.getElementById(
"refLink"
);

navigator.clipboard.writeText(
input.value
);

alert(
"Referral link copied!"
);

}


function whatsappShare(){

let link =
document.getElementById(
"refLink"
).value;

let text =
encodeURIComponent(
"Join Bishal Pro Reward Hub 🎮\\n"+
"My referral code: "+
referralCode+
"\\n"+
link
);

window.open(
"https://wa.me/?text="+text,
"_blank"
);

}


/* =========================
   WITHDRAW
========================= */

function withdraw(){

openModal(

"💳 Withdraw Coins",

`

<p style="
color:#9daac5;
line-height:1.5;
margin:10px 0 15px
">

Demo withdrawal form. UPI ID validation is included,
but this demo does not transfer real money.

</p>

<label>
UPI ID
</label>

<input
id="upi"
class="input"
placeholder="example@upi"
>

<br><br>

<label>
Coins
</label>

<input
id="withdrawAmount"
class="input"
type="number"
min="1"
max="${coins}"
value="${Math.min(1000,coins)}"
>

<button
class="btn green"
onclick="submitWithdrawal()">

💳 SUBMIT WITHDRAWAL

</button>

<div
id="withdrawStatus"
class="status">

</div>

`

);

}


function submitWithdrawal(){

let upi =
document.getElementById(
"upi"
).value.trim();

let amount =
Number(
document.getElementById(
"withdrawAmount"
).value
);


if(
!upi.includes("@")
){

document.getElementById(
"withdrawStatus"
).innerText =
"❌ Enter valid UPI ID";

return;

}


if(
amount<=0 ||
amount>coins
){

document.getElementById(
"withdrawStatus"
).innerText =
"❌ Invalid coin amount";

return;

}


coins -= amount;

history.unshift({

amount:-amount,

text:
"Demo Withdrawal • "+
upi,

icon:"💳",

time:
new Date().toLocaleString()

});

save();


document.getElementById(
"withdrawStatus"
).innerHTML =
"✅ Withdrawal request submitted in DEMO mode.";

}


/* =========================
   HISTORY
========================= */

function openHistory(){

let html="";

if(history.length===0){

html=
"<p style='color:#9daac5'>No history yet.</p>";

}else{

history.forEach(x=>{

html += `

<div class="row">

<span>
${x.icon}
${x.text}
</span>

<b>
${x.amount>0?"+":""}${x.amount}
</b>

</div>

`;

});

}

/* =========================
   MODAL
========================= */

function openModal(
title,
content
){

document.getElementById(
"sheet"
).innerHTML = `

<div class="modal-head">

<h2>${title}</h2>

<button
class="close"
onclick="closeModal()">

✕

</button>

</div>

${content}

`;

document.getElementById(
"modal"
).classList.add("show");

}


function closeModal(){

document.getElementById(
"modal"
).classList.remove("show");

}

function celebrate(){

let box =
document.getElementById(
"confetti"
);

box.innerHTML="";

for(
let i=0;
i<80;
i++
){

let p =
document.createElement("i");

p.style.left =
Math.random()*100+
"%";

p.style.top="-20px";

p.style.background =
[
"#ffcf33",
"#35d889",
"#4f8cff",
"#ff536d",
"#a060ff"
][
Math.floor(
Math.random()*5
)
];

p.style.animationDelay =
Math.random()*0.4+
"s";

box.appendChild(p);

}

setTimeout(
()=>box.innerHTML="",
1800
);

}
