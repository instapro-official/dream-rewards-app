<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:#061735;
  color:#fff;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
  font-weight:700;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
  display:none;
}

.app.show{
  display:block;
}

/* =========================
   HEADER - SCREENSHOT STYLE
========================= */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:linear-gradient(135deg,#071a3c,#082653);
  border-bottom:1px solid rgba(59,130,246,.16);
  position:sticky;
  top:0;
  backdrop-filter:blur(18px);
  z-index:10;
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#1488e8,#235eea,#4935c8);
  font-size:18px;
  box-shadow:0 0 18px rgba(37,99,235,.45);
}

.name{
  font-weight:800;
  font-size:14px;
  letter-spacing:.3px;
}

.id{
  font-size:11px;
  color:#8ea5c9;
}

.balance-pill{
  background:linear-gradient(135deg,#12366c,#173e7a);
  border:1px solid rgba(82,145,235,.28);
  padding:8px 15px;
  border-radius:17px;
  font-size:14px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}

/* =========================
   HERO
========================= */

.hero-card{
  margin:16px;
  padding:23px 20px;
  border-radius:27px;
  background:
    radial-gradient(circle at 90% 10%,rgba(113,76,255,.35),transparent 38%),
    linear-gradient(135deg,#075087,#123c8b 48%,#321d82);
  box-shadow:
    0 15px 38px rgba(0,0,0,.32),
    inset 0 1px 2px rgba(255,255,255,.18);
  position:relative;
  overflow:hidden;
  border:1px solid rgba(89,153,235,.25);
}

.hero-card::before{
  content:'';
  position:absolute;
  top:-55px;
  right:-45px;
  width:130px;
  height:130px;
  background:radial-gradient(
    circle,
    rgba(77,142,255,.28) 0%,
    transparent 70%
  );
  border-radius:50%;
}

.hero-title{
  font-size:11px;
  letter-spacing:1.5px;
  color:#a6bddc;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:8px;
}

.hero-balance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.hero-amount{
  font-size:32px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:10px;
  text-shadow:0 2px 12px rgba(0,0,0,.4);
}

.hero-coins-icon{
  font-size:32px;
  filter:drop-shadow(0 0 8px rgba(234,179,8,.55));
}

.hero-btns{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-top:20px;
}

.hero-btn{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  padding:12px;
  border-radius:15px;
  color:#fff;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  backdrop-filter:blur(8px);
  transition:.2s;
  font-weight:700;
}

.hero-btn:active{
  transform:scale(.97);
}

/* =========================
   BANNER
========================= */

.banner-ad-container{
  margin:0 16px 14px;
  background:rgba(14,40,78,.65);
  border:1px dashed rgba(117,157,207,.22);
  border-radius:15px;
  padding:10px;
  text-align:center;
  font-size:11px;
  color:#8297b7;
}

/* =========================
   SECTION
========================= */

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 18px 12px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.5px;
}

.section-header span{
  color:#7d9cc9;
  font-size:12px;
  cursor:pointer;
  font-weight:700;
}

/* =========================
   GAME GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  padding:0 16px 14px;
}

/* DARK SCREENSHOT CARDS */

.card{
  border-radius:22px;
  padding:15px 14px;
  min-height:188px;
  box-shadow:
    0 9px 25px rgba(0,0,0,.34),
    inset 0 1px 1px rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(73,126,190,.20);
  transition:.25s;
}

.card::after{
  content:'';
  position:absolute;
  width:90px;
  height:90px;
  right:-35px;
  top:-35px;
  border-radius:50%;
  background:rgba(57,111,190,.13);
  pointer-events:none;
}

.card:active{
  transform:scale(.97);
}

/* ALL CARDS NOW DARK BLUE LIKE SCREENSHOT */

.card-blue{
  background:
    linear-gradient(145deg,#123b70,#102f60 55%,#102b58);
  box-shadow:0 9px 25px rgba(0,0,0,.34);
}

.card-purple{
  background:
    linear-gradient(145deg,#18366d,#162e61 55%,#1d2d69);
  box-shadow:0 9px 25px rgba(0,0,0,.34);
}

.card-green{
  background:
    linear-gradient(145deg,#123e5c,#123455 55%,#15345d);
  box-shadow:0 9px 25px rgba(0,0,0,.34);
}

.card-orange{
  background:
    linear-gradient(145deg,#183b64,#16335c 55%,#202e61);
  box-shadow:0 9px 25px rgba(0,0,0,.34);
}

.card-full{
  background:
    linear-gradient(135deg,#123d72,#1a326d 55%,#32246e);
  margin:0 16px 14px;
  min-height:175px;
}

/* =========================
   SMALL GAME ICONS
========================= */

.icon-box{
  width:39px;
  height:39px;
  min-width:39px;
  border-radius:12px;
  background:rgba(34,94,160,.42);
  display:grid;
  place-items:center;
  font-size:20px;
  box-shadow:
    0 4px 10px rgba(0,0,0,.25),
    inset 0 1px 1px rgba(255,255,255,.08);
  border:1px solid rgba(89,157,221,.12);
  position:relative;
  z-index:1;
}

/* Slightly smaller icon on full card */

.card-full .icon-box{
  width:40px;
  height:40px;
  font-size:20px;
}

/* GAME TEXT */

.card h3{
  margin:9px 0 4px;
  font-size:14px;
  font-weight:800;
  color:#fff;
  position:relative;
  z-index:1;
}

.card p{
  font-size:11px;
  color:#aebed5;
  line-height:1.4;
  position:relative;
  z-index:1;
}

.badge-tag{
  position:absolute;
  top:10px;
  right:9px;
  background:rgba(3,18,43,.48);
  border:1px solid rgba(130,169,215,.18);
  padding:3px 8px;
  border-radius:10px;
  font-size:8px;
  color:#b9d3f4;
  font-weight:800;
  backdrop-filter:blur(5px);
  z-index:2;
}

/* =========================
   CARD BUTTON
========================= */

.card-btn{
  width:100%;
  padding:9px;
  border-radius:11px;
  background:linear-gradient(
    135deg,
    rgba(31,117,235,.92),
    rgba(93,54,220,.92)
  );
  color:white;
  margin-top:13px;
  font-size:11px;
  font-weight:800;
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  backdrop-filter:blur(5px);
  transition:.2s;
  position:relative;
  z-index:2;
}

.card-btn:active{
  background:linear-gradient(
    135deg,
    rgba(45,133,247,1),
    rgba(111,67,232,1)
  );
  transform:scale(.98);
}

/* =========================
   WITHDRAW
========================= */

.withdraw-main{
  margin:10px 16px 20px;
  width:calc(100% - 32px);
  padding:15px;
  border-radius:19px;
  background:linear-gradient(135deg,#1266d5,#3157d9,#5b36d0);
  color:#fff;
  font-size:15px;
  font-weight:900;
  box-shadow:0 10px 28px rgba(22,83,180,.35);
  letter-spacing:.5px;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  background:rgba(5,20,48,.96);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(74,119,178,.20);
  display:flex;
  justify-content:space-around;
  padding:11px 0 17px;
  z-index:25;
  box-shadow:0 -10px 30px rgba(0,0,0,.48);
}

.nav-item{
  background:transparent;
  border:0;
  color:#6f84a7;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.nav-item.active{
  color:#48a8ff;
  text-shadow:0 0 12px rgba(72,168,255,.55);
}

.nav-item span:first-child{
  font-size:19px;
}

/* =========================
   ACCOUNT PAGE
========================= */

.account-page{
  display:none;
  position:fixed;
  inset:0;
  background:#061735;
  z-index:35;
  overflow:auto;
  padding-bottom:90px;
}

.account-page.show{
  display:block;
}

.acc-header{
  background:
    linear-gradient(135deg,#071d42,#103d78,#29246b);
  padding:20px;
  border-bottom:1px solid rgba(79,137,205,.18);
  position:relative;
}

.acc-top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.acc-back-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;
  padding:8px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  backdrop-filter:blur(8px);
  transition:.2s;
}

.acc-back-btn:active{
  transform:scale(.95);
}

.acc-user-row{
  display:flex;
  align-items:center;
  gap:14px;
}

.acc-avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#1589ed,#315edc,#5537c9);
  display:grid;
  place-items:center;
  font-size:28px;
  box-shadow:0 0 22px rgba(37,99,235,.42);
}

.acc-info h2{
  font-size:16px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px;
}

.vip-badge{
  background:linear-gradient(135deg,#e7a61a,#bd7612);
  color:#fff;
  font-size:9px;
  padding:2px 8px;
  border-radius:8px;
  font-weight:800;
}

.acc-uid{
  font-size:12px;
  color:#9eb4d2;
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:6px;
}

.acc-login-time{
  font-size:11px;
  color:#7086a8;
  margin-top:2px;
}

/* =========================
   WALLET
========================= */

.acc-wallet{
  margin:16px;
  padding:19px;
  border-radius:22px;
  background:
    linear-gradient(135deg,#104b91,#1852a0,#21418b);
  box-shadow:0 10px 28px rgba(0,0,0,.32);
  border:1px solid rgba(87,148,218,.22);
}

.acc-wallet-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.acc-wallet-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  text-align:center;
}

.acc-wallet-item{
  background:rgba(255,255,255,.10);
  padding:13px 8px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
}

.acc-wallet-item span{
  font-size:19px;
  display:block;
  margin-bottom:4px;
}

.acc-wallet-item p{
  font-size:10px;
  font-weight:800;
}

/* =========================
   ACCOUNT MENU
========================= */

.acc-menu-list{
  padding:0 16px;
  display:grid;
  gap:12px;
}

.acc-menu-card{
  background:rgba(16,45,83,.72);
  border:1px solid rgba(74,125,185,.17);
  border-radius:17px;
  padding:15px;
  display:flex;
  justify-content:between;
  align-items:center;
  cursor:pointer;
}

.acc-menu-card:active{
  background:rgba(28,66,112,.8);
}

.acc-menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px;
  margin-top:12px;
}

/* =========================
   LOGIN
========================= */

.login-container{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%,rgba(28,91,169,.22),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(71,45,166,.20),transparent 30%),
    #061735;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:
    linear-gradient(145deg,#102b58,#091c3b);
  border:1px solid rgba(86,143,207,.22);
  border-radius:27px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.65);
}

.login-box h2{
  text-align:center;
  margin-bottom:8px;
  font-size:24px;
  font-weight:900;
}

.login-box p{
  text-align:center;
  color:#91a6c4;
  font-size:12px;
  margin-bottom:20px;
}

.auth-tabs{
  display:flex;
  background:rgba(255,255,255,.06);
  border-radius:12px;
  padding:4px;
  margin-bottom:16px;
}

.auth-tab{
  flex:1;
  padding:8px;
  text-align:center;
  font-size:12px;
  font-weight:800;
  border-radius:10px;
  cursor:pointer;
  color:#7187a7;
  background:transparent;
  border:0;
}

.auth-tab.active{
  background:linear-gradient(135deg,#197de0,#5137d1);
  color:#fff;
}

/* =========================
   ADMIN
========================= */

.admin-panel{
  display:none;
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:16px;
  background:#061735;
  z-index:150;
  position:fixed;
  inset:0;
  overflow:auto;
}

.admin-panel.show{
  display:block;
}

.admin-card{
  background:rgba(16,45,83,.72);
  border:1px solid rgba(74,125,185,.17);
  border-radius:16px;
  padding:16px;
  margin-top:12px;
  font-size:13px;
}

/* =========================
   MODALS
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,8,22,.88);
  z-index:40;
  align-items:center;
  justify-content:center;
  padding:16px;
  backdrop-filter:blur(10px);
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:440px;
  background:
    linear-gradient(145deg,#102851,#081a37);
  border:1px solid rgba(80,139,208,.20);
  border-radius:27px;
  padding:24px;
  max-height:90vh;
  overflow:auto;
  box-shadow:0 25px 60px rgba(0,0,0,.85);
}

.close{
  float:right;
  background:rgba(255,255,255,.10);
  color:#fff;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:16px;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.box h2{
  text-align:center;
  margin:0 0 16px;
  font-size:18px;
  font-weight:900;
}

/* =========================
   RULES
========================= */

.rule-box{
  background:rgba(17,47,87,.70);
  border:1px solid rgba(78,126,183,.16);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  font-size:12px;
  line-height:1.4;
  color:#b9c9dd;
}

.rule-box h4{
  color:#8fc8ff;
  margin-bottom:4px;
  font-size:13px;
}

/* =========================
   TASK TIMELINE
========================= */

.task-header-box{
  background:
    linear-gradient(135deg,#124e91,#27468f,#382b82);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.32);
}

.task-stats-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.22);
  padding:14px;
  border-radius:16px;
  margin-top:12px;
}

.circular-progress{
  position:relative;
  width:56px;
  height:56px;
  border-radius:50%;
  background:conic-gradient(
    #22c55e 75%,
    rgba(255,255,255,.15) 0deg
  );
  display:grid;
  place-items:center;
  box-shadow:0 0 12px rgba(34,197,94,.35);
}

.circular-inner{
  width:46px;
  height:46px;
  background:#102951;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:900;
}

.timeline{
  position:relative;
  padding-left:24px;
  margin-top:15px;
}

.timeline::before{
  content:'';
  position:absolute;
  left:8px;
  top:6px;
  bottom:6px;
  width:2px;
  background:rgba(255,255,255,.18);
}

.timeline-item{
  position:relative;
  margin-bottom:16px;
  background:rgba(16,45,83,.70);
  border:1px solid rgba(78,126,183,.15);
  padding:14px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.timeline-dot{
  position:absolute;
  left:-24px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  background:#22c55e;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:10px;
  color:#fff;
  border:2px solid #102951;
  box-shadow:0 0 8px rgba(34,197,94,.55);
}

.timeline-dot.pending{
  background:#536987;
}

/* =========================
   LUCKY CARD
========================= */

.lucky{
  height:150px;
  border-radius:20px;
  background:
    linear-gradient(135deg,#145a9d,#303f9b,#4a318d);
  display:grid;
  place-items:center;
  font-size:44px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* =========================
   QUIZ
========================= */

.quiz-q{
  font-size:15px;
  font-weight:800;
  text-align:center;
  background:rgba(20,52,91,.72);
  padding:16px;
  border-radius:16px;
  margin-bottom:14px;
  border:1px solid rgba(80,133,190,.16);
}

.answers{
  display:grid;
  gap:10px;
}

.answers button{
  padding:14px;
  border-radius:14px;
  background:rgba(25,59,101,.72);
  color:#fff;
  text-align:left;
  font-size:13px;
  font-weight:700;
  border:1px solid rgba(80,133,190,.15);
  transition:.2s;
}

.answers button:active{
  background:rgba(40,85,139,.85);
}

/* =========================
   SURVEY
========================= */

.surveyPage{
  display:none;
  position:fixed;
  inset:0;
  background:#061735;
  z-index:40;
  overflow:auto;
}

.surveyPage.show{
  display:block;
}

.surveyInner{
  max-width:480px;
  margin:auto;
  padding-bottom:40px;
}

.surveyHead{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  position:sticky;
  top:0;
  background:rgba(6,23,53,.95);
  backdrop-filter:blur(15px);
  z-index:5;
  border-bottom:1px solid rgba(80,130,190,.15);
}

.back{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-size:20px;
  display:grid;
  place-items:center;
}

.surveyHead h2{
  font-size:16px;
}

.surveyCount{
  text-align:center;
  color:#9db1cd;
  padding:12px 16px;
  font-size:12px;
  font-weight:700;
}

.survey{
  margin:10px 16px;
  padding:16px;
  background:rgba(16,45,83,.72);
  border:1px solid rgba(74,125,185,.16);
  border-radius:18px;
}

.survey b{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.survey small{
  color:#9eb1cb;
  font-size:11px;
}

/* =========================
   INPUTS
========================= */

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(91,142,199,.22);
  background:rgba(12,35,67,.80);
  color:#fff;
