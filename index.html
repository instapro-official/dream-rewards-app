<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MathGuru - Earn & Learn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0b0f29;color:#fff;min-height:100vh}
button{border:0;cursor:pointer;font-weight:700}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:100px;display:none}
.app.show{display:block}

/* LOGIN SCREEN (MathGuru Style) */
.login-container{position:fixed;inset:0;background:radial-gradient(circle at center, #1e1b4b 0%, #0b0f29 100%);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-box{width:100%;max-width:380px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(20px);border-radius:32px;padding:32px 24px;box-shadow:0 25px 60px rgba(0,0,0,0.8);text-align:center}
.login-box h1{font-size:28px;font-weight:900;color:#38bdf8;margin-bottom:6px;letter-spacing:0.5px}
.login-box p{color:#94a3b8;font-size:13px;margin-bottom:28px}

.login-input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#fff;font-size:15px;margin-bottom:14px;outline:none;font-weight:600}
.login-input::placeholder{color:#64748b}

.google-btn{width:100%;padding:14px;border-radius:18px;background:#fff;color:#1e293b;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;box-shadow:0 8px 20px rgba(0,0,0,0.3);transition:0.2s}
.google-btn:active{transform:scale(0.97)}

.primary-btn{width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;font-size:15px;font-weight:800;margin-top:4px;box-shadow:0 10px 25px rgba(37,99,235,0.4)}
.primary-btn:active{transform:scale(0.97)}

.terms{font-size:11px;color:#64748b;margin-top:24px;line-height:1.4}
.terms a{color:#38bdf8;text-decoration:none}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(18,24,61,0.9);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;backdrop-filter:blur(15px);z-index:10}
.profile{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0284c7,#8b5cf6);font-size:18px}
.name{font-weight:800;font-size:14px}.id{font-size:11px;color:#94a3b8}
.balance-pill{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:16px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}

/* HERO CARD */
.hero-card{margin:16px;padding:24px 20px;border-radius:26px;background:linear-gradient(135deg,#0369a1,#1d4ed8,#7c3aed);box-shadow:0 15px 35px rgba(3,105,161,0.4);border:1px solid rgba(255,255,255,0.2)}
.hero-title{font-size:11px;letter-spacing:1px;color:#bae6fd;font-weight:800;text-transform:uppercase;margin-bottom:6px}
.hero-amount{font-size:32px;font-weight:900;display:flex;align-items:center;gap:10px}

/* GRID CARDS */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 14px}
.card{border-radius:20px;padding:18px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.card h3{margin:10px 0 4px;font-size:14px;font-weight:800}
.card p{font-size:11px;color:#94a3b8;line-height:1.35}
.card-btn{width:100%;padding:10px;border-radius:12px;background:rgba(255,255,255,0.15);color:white;margin-top:14px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,0.2)}

/* SUPPORT SECTION */
.support-section{margin:16px;padding:18px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between}
.support-info h4{font-size:13px;font-weight:800;margin-bottom:2px}
.support-info p{font-size:11px;color:#94a3b8}
.support-btn{padding:8px 16px;border-radius:12px;background:#0284c7;color:#fff;font-size:11px;font-weight:800;text-decoration:none}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translate(-50%);width:min(480px,100%);background:rgba(11,15,41,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-around;padding:12px 0 18px;z-index:25}
.nav-item{background:transparent;border:0;color:#64748b;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;cursor:pointer;font-weight:700}
.nav-item.active{color:#38bdf8}
.nav-item span:first-child{font-size:20px}

/* TOAST */
.toast{position:fixed;top:15px;left:50%;transform:translate(-50%,-120px);background:#1e293b;border:1px solid rgba(255,255,255,0.2);padding:12px 20px;border-radius:16px;z-index:200;transition:.3s;font-size:13px;font-weight:800;color:#38bdf8;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-container" id="loginContainer">
<div class="login-box">
<h1>MathGuru</h1>
<p>Sign in to continue earning</p>

<input class="login-input" id="mobileInput" type="tel" placeholder="Mobile Number" maxlength="10">
<button class="primary-btn" onclick="handleMobileLogin()">Continue with Number</button>

<button class="google-btn" onclick="handleGoogleLogin()">
<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.53 0 9s.35 2.85.95 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.01 2.33c.71-2.13 2.7-3.71 5.04-3.71z"/></svg>
Continue with Google
</button>

<div class="terms">
By continuing, you agree to our <a href="#">Terms & Conditions</a> & <a href="#">Privacy Policy</a>
</div>
</div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp">
<header>
<div class="profile">
<div class="avatar">👨‍🎓</div>
<div><div class="name" id="userName">Math User</div><div class="id" id="userPhoneDisplay">ID | --</div></div>
</div>
<div class="balance-pill">🪙 <span id="topCoins">0</span></div>
</header>

<section class="hero-card">
<div class="hero-title">Total Balance</div>
<div class="hero-amount">🪙 <span id="coins">0</span> Coins</div>
</section>

<div class="grid">
<div class="card">
<h3>Daily Check-in</h3>
<p>Get free coins every single day.</p>
<button class="card-btn" onclick="dailyBonus()">CLAIM ➔</button>
</div>
<div class="card">
<h3>Math Quiz</h3>
<p>Solve questions & earn rewards.</p>
<button class="card-btn" onclick="solveQuiz()">PLAY ➔</button>
</div>
</div>

<!-- HELP & SUPPORT -->
<div class="support-section">
<div class="support-info">
<h4>Help & Support</h4>
<p>Telegram: @ROYALNEST00</p>
</div>
<a href="https://t.me/ROYALNEST00" target="_blank" class="support-btn">CONTACT</a>
</div>

<nav class="bottom-nav">
<button class="nav-item active"><span>🏠</span>Home</button>
<button class="nav-item" onclick="toast('Refer & Earn Active!')"><span>👥</span>Refer</button>
<button class="nav-item" onclick="toast('Wallet Active')"><span>💰</span>Wallet</button>
<button class="nav-item" onclick="logoutUser()"><span>🚪</span>Logout</button>
</nav>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;

function toast(t) {
let x = document.getElementById("toast");
x.textContent = t;
x.classList.add("show");
setTimeout(() => x.classList.remove("show"), 2000);
}

function handleMobileLogin() {
let num = document.getElementById("mobileInput").value.trim();
if(num.length !== 10 || isNaN(num)) {
toast("Please enter a valid 10-digit mobile number");
return;
}
loginUser("📱 " + num);
}

function handleGoogleLogin() {
let googleUser = "Google_User_" + Math.floor(1000 + Math.random() * 9000);
loginUser(googleUser);
}

function loginUser(identifier) {
currentUser = identifier;
let savedData = localStorage.getItem("user_" + identifier);
let userCoins = 0;

if(savedData) {
userCoins = Number(JSON.parse(savedData).coins);
} else {
userCoins = 50; 
localStorage.setItem("user_" + identifier, JSON.stringify({ coins: userCoins }));
}

localStorage.setItem("activeUser", identifier);
document.getElementById("loginContainer").style.display = "none";
document.getElementById("mainApp").classList.add("show");
document.getElementById("userPhoneDisplay").textContent = identifier;
updateCoinsUI(userCoins);
toast("Login Successful!");
}

function updateCoinsUI(val) {
document.getElementById("coins").textContent = val;
document.getElementById("topCoins").textContent = val;
if(currentUser) {
let data = JSON.parse(localStorage.getItem("user_" + currentUser) || "{}");
data.coins = val;
localStorage.setItem("user_" + currentUser, JSON.stringify(data));
}
}

function dailyBonus() {
let currentCoins = Number(document.getElementById("coins").textContent);
currentCoins += 20;
updateCoinsUI(currentCoins);
toast("🎁 +20 Coins Claimed!");
}

function solveQuiz() {
let currentCoins = Number(document.getElementById("coins").textContent);
currentCoins += 10;
updateCoinsUI(currentCoins);
toast("✅ Correct Answer! +10 Coins");
}

function logoutUser() {
localStorage.removeItem("activeUser");
document.getElementById("mainApp").classList.remove("show");
document.getElementById("loginContainer").style.display = "flex";
document.getElementById("mobileInput").value = "";
currentUser = null;
toast("Logged out successfully");
}

window.onload = function() {
let active = localStorage.getItem("activeUser");
if(active) {
loginUser(active);
}
};
</script>

</body>
</html>
