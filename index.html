<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Bishal Pro Rewards</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#07112d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    max-width:760px;
    margin:auto;
    min-height:100vh;
    padding-bottom:105px;
}

/* ================= HEADER ================= */

.header{
    height:105px;
    background:#101d40;
    display:flex;
    align-items:center;
    padding:16px 18px;
    gap:12px;
    border-bottom:1px solid #24345a;
}

.profile-logo{
    width:54px;
    height:54px;
    min-width:54px;
    border-radius:50%;
    border:2px solid #ffd52e;
    background:#24365f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:900;
}

.user-info{
    min-width:0;
}

.username{
    font-size:18px;
    font-weight:900;
}

.user-id{
    color:#9aa8c4;
    font-size:13px;
    margin-top:5px;
}

.coin-wallet{
    margin-left:auto;
    border:1px solid #6f6327;
    background:#0d1934;
    border-radius:30px;
    padding:10px 14px;
    font-weight:900;
    white-space:nowrap;
}

/* ================= CONTENT ================= */

.content{
    padding:18px;
}

/* ================= HERO ================= */

.hero{
    background:linear-gradient(
        135deg,
        #397cff,
        #2454d3
    );
    border-radius:25px;
    padding:24px;
    box-shadow:0 15px 35px #0005;
}

.hero h1{
    font-size:23px;
    margin-bottom:8px;
}

.hero p{
    color:#dce7ff;
    font-size:15px;
    line-height:1.5;
    margin-bottom:16px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    background:#1451bd;
    padding:8px 11px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

/* ================= TOP CARDS ================= */

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
}

.card{
    background:#14223b;
    border:1px solid #293b5e;
    border-radius:21px;
    padding:17px;
}

.card-icon{
    width:48px;
    height:48px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:31px;
}

.card h3{
    text-align:center;
    font-size:17px;
    margin:8px 0 6px;
}

.card p{
    color:#9aa8c4;
    text-align:center;
    min-height:38px;
    line-height:1.4;
}

.btn{
    width:100%;
    margin-top:12px;
    padding:13px;
    border-radius:13px;
    background:#3476f5;
    color:#fff;
    font-weight:900;
    font-size:15px;
}

.green{
    background:#20c968;
}

.gray{
    background:#263653;
}

.btn:disabled{
    opacity:.6;
}

/* ================= SECTION ================= */

.section{
    margin-top:25px;
}

.section-title{
    font-size:19px;
    font-weight:900;
    margin-bottom:12px;
}

/* ================= GAMES ================= */

.games{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:9px;
}

.game{
    min-height:112px;
    background:#14223b;
    border:1px solid #293b5e;
    border-radius:18px;
    color:#fff;
    padding:12px 4px;
}

.game-icon{
    height:38px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
}

.game b{
    display:block;
    font-size:12px;
    margin-top:6px;
}

.game small{
    display:block;
    color:#8998b5;
    margin-top:4px;
}

/* ================= TASKS ================= */

.tasks{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:10px;
}

.task{
    min-height:105px;
    background:#14223b;
    border:1px solid #293b5e;
    border-radius:18px;
    color:#fff;
    padding:13px 5px;
}

.task-icon{
    font-size:25px;
    margin-bottom:6px;
}

.reward{
    display:inline-block;
    margin-top:8px;
    background:#40351e;
    color:#ffd447;
    padding:6px 8px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
}

/* ================= BOTTOM ================= */

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:760px;
    margin:auto;
    padding:11px 18px;
    background:#07112d;
    z-index:50;
}

.withdraw-main{
    width:100%;
    padding:16px;
    border-radius:16px;
    background:#20c968;
    color:#fff;
    font-size:18px;
    font-weight:900;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:100;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:760px;
    max-height:91vh;
    overflow:auto;
    margin:auto;
    background:#0d1932;
    border-radius:26px 26px 0 0;
    padding:20px;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.close{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#263653;
    color:#fff;
    font-size:18px;
}

/* ================= INPUT ================= */

label{
    display:block;
    color:#dbe4f5;
    font-size:13px;
    margin-top:12px;
}

.input{
    width:100%;
    margin-top:7px;
    padding:14px;
    border-radius:12px;
    border:1px solid #34496e;
    background:#09142b;
    color:#fff;
    outline:none;
}

.input:focus{
    border-color:#397cff;
}

/* ================= WHEEL ================= */

.wheel-area{
    text-align:center;
}

.wheel-box{
    width:250px;
    height:250px;
    margin:22px auto;
    position:relative;
}

.pointer{
    position:absolute;
    z-index:4;
    top:-13px;
    left:50%;
    transform:translateX(-50%);
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-bottom:28px solid #ff5364;
}

.wheel{
    width:250px;
    height:250px;
    border-radius:50%;
    border:8px solid #f5d347;

    background:
    conic-gradient(
        #3476f5 0deg 72deg,
        #ff5364 72deg 144deg,
        #20c968 144deg 216deg,
        #955bff 216deg 288deg,
        #ffb928 288deg 360deg
    );

    box-shadow:0 12px 30px #0008;

    transition:
        transform 4s
        cubic-bezier(.12,.76,.17,1);
}

.wheel-values{
    display:flex;
    justify-content:center;
    gap:6px;
}

.wheel-values span{
    background:#192844;
    padding:7px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:900;
}

/* ================= QUIZ ================= */

.quiz-type{
    text-align:center;
    color:#ffd447;
    font-weight:900;
}

.question{
    font-size:27px;
    font-weight:900;
    text-align:center;
    margin:25px 0;
    line-height:1.35;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.answer{
    padding:15px;
    border-radius:13px;
    background:#1a2b49;
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.answer.correct{
    background:#0c9850;
}

.answer.wrong{
    background:#bd394b;
}

.status{
    text-align:center;
    min-height:30px;
    margin:15px 0;
    font-weight:900;
}

.big-congrats{
    font-size:32px;
    animation:pop .55s ease;
}

@keyframes pop{
    0%{
        transform:scale(.3);
        opacity:0;
    }
    70%{
        transform:scale(1.15);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* ================= HISTORY ================= */

.history-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    background:#14223b;
    border:1px solid #253654;
    padding:13px;
    border-radius:12px;
    margin-top:8px;
}

.history-row small{
    display:block;
    color:#8291ae;
    margin-top:4px;
}

/* ================= CONFETTI ================= */

.confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:200;
}

.confetti i{
    position:absolute;
    width:8px;
    height:15px;
    animation:fall 1.6s linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(100vh)
            rotate(720deg);
        opacity:0;
    }
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .content{
        padding:14px;
    }

    .header{
        height:92px;
        padding:13px 15px;
    }

    .profile-logo{
        width:48px;
        height:48px;
        min-width:48px;
        font-size:16px;
    }

    .username{
        font-size:17px;
    }

    .coin-wallet{
        padding:9px 10px;
        font-size:14px;
    }

    .hero{
        padding:21px;
    }

    .hero h1{
        font-size:21px;
    }

    .two{
        gap:10px;
    }

    .card{
        padding:14px 10px;
    }

    .card-icon{
        font-size:28px;
        height:42px;
    }

    .card h3{
        font-size:16px;
    }

    .games{
        gap:6px;
    }

    .game{
        min-height:102px;
    }

    .game-icon{
        font-size:25px;
    }

    .game b{
        font-size:11px;
    }

    .tasks{
        gap:7px;
    }

    .task{
        min-height:100px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

    <div class="profile-logo">
        BP
    </div>

    <div class="user-info">
        <div class="username">
            Bishal_Pro 👑
        </div>

        <div class="user-id">
            ID: 10001
        </div>
    </div>

    <div class="coin-wallet">
        🪙 <span id="coins">20,850</span>
    </div>

</header>


<div class="content">

<!-- HERO -->

<section class="hero">

    <h1>
        PLAY • EARN • REWARDS
    </h1>

    <p>
        Play games, complete tasks and collect coins.
    </p>

    <div class="badges">

        <span class="badge">
            🛡️ Secure
        </span>

        <span class="badge">
            ⚡ Fast Updates
        </span>

        <span class="badge">
            🎁 Daily Rewards
        </span>

    </div>

</section>


<!-- BONUS -->

<div class="two">

    <div class="card">

        <div class="card-icon">
            🎁
        </div>

        <h3>
            DAILY BONUS
        </h3>

        <p id="bonusText">

        </p>

        <button
            id="bonusButton"
            class="btn green"
            onclick="dailyBonus()">

            CLAIM NOW

    </div>


    <div class="card">

        <div class="card-icon">

        </div>

        <h3>

        </h3>

        <p>
            Earn 10 Coins
        </p>

        <button
            class="btn"
            onclick="watchAds()">

        </button>

</div>


<!-- PLAY -->

<section class="section">

    <div class="section-title">

    </div>

    <div class="games">

        <button
            class="game"
            onclick="openWheel()">

            <div class="game-icon">
                🎡
            </div>

            <b>
                Spin Wheel
            </b>

            <small>
                Win Coins
            </small>

        </button>


        <button
            class="game"
            onclick="openQuiz()">

            <div class="game-icon">
                🧠
            </div>

            <b>
                Quiz
            </b>

            <small>
                Play
            </small>

        </button>


        <button
            class="game"
            onclick="openRankings()">

            <div class="game-icon">
                🏆
            </div>

            <b>
                Rankings
            </b>

            <small>
                Top Wins
            </small>

        </button>


        <button
            class="game"
            onclick="openLucky()">

            <div class="game-icon">
                🎟️
            </div>

            <b>
                Lucky Card
            </b>

            <small>
                Win 1000
            </small>

        </button>

    </div>

</section>


<!-- EXTRA TASKS -->

<section class="section">

    <div class="section-title">
        🔥 EXTRA TASKS
    </div>

    <div class="tasks">

        <button
            class="task"
            onclick="completeTask('Download',100)">

            <div class="task-icon">
                ⬇️
            </div>

            <b>
                Download
            </b>

            <div class="reward">
                +100 Coins
            </div>

        </button>


        <button
            class="task"
            onclick="completeTask('Survey',150)">

            <div class="task-icon">
                📊
            </div>

            <b>
                Survey
            </b>

            <div class="reward">
                +150 Coins
            </div>

        </button>


        <button
            class="task"
            onclick="openReferral()">

            <div class="task-icon">
                👥
            </div>

            <b>
                Invite
            </b>

            <div class="reward">
                +200 Coins
            </div>

        </button>

    </div>

</section>

</div>


<!-- BOTTOM -->

<div class="bottom">

    <button
        class="withdraw-main"
        onclick="openWallet()">

        💳 WITHDRAW COINS

    </button>

</div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal">

    <div
        id="sheet"
        class="sheet">
    </div>

</div>


<div
    id="confetti"
    class="confetti">
</div>


<script>

/* =================================================
   DATA
================================================= */

let coins =
    Number(
        localStorage.getItem("coins")
    ) || 20850;

let lastBonus =
    localStorage.getItem(
        "lastBonus"
    ) || "";

let history =
    JSON.parse(
        localStorage.getItem(
            "history"
        ) || "[]"
    );

let currentQuizType =
    localStorage.getItem(
        "quizType"
    ) || "math";

let currentAnswer;


/* =================================================
   SAVE
================================================= */

function save(){

    localStorage.setItem(
        "coins",
        coins
    );

    localStorage.setItem(
        "lastBonus",
        lastBonus
    );

    localStorage.setItem(
        "history",
        JSON.stringify(history)
    );

    localStorage.setItem(
        "quizType",
        currentQuizType
    );

    document.getElementById(
        "coins"
    ).textContent =
        coins.toLocaleString(
            "en-IN"
        );
}


/* =================================================
   ADD COINS
================================================= */

function addCoins(
    amount,
    title,
    icon="🪙"
){

    coins += amount;

    history.unshift({

        amount:amount,

        title:title,

        icon:icon,

        time:
            new Date()
            .toLocaleString()

    });

    history =
        history.slice(
            0,
            100
        );

    save();
}


/* =================================================
   DAILY BONUS
================================================= */

function dailyBonus(){

    let today =
        new Date()
        .toISOString()
        .slice(0,10);

    if(
        lastBonus === today
    ){

        alert(
            "Daily bonus already claimed."
        );

        return;
    }

    lastBonus =
        today;

    addCoins(
        50,
        "Daily Bonus",
        "🎁"
    );

    document.getElementById(
        "bonusButton"
    ).textContent =
        "CLAIMED TODAY";

    document.getElementById(
        "bonusText"
    ).textContent =
        "Come back tomorrow";

    alert(
        "🎉 Congratulations! +50 Coins"
    );
}


/* =================================================
   CHECK BONUS
================================================= */

(function(){

    let today =
        new Date()
        .toISOString()
        .slice(0,10);

    if(
        lastBonus === today
    ){

        document.getElementById(
            "bonusButton"
        ).textContent =
            "CLAIMED TODAY";

        document.getElementById(
            "bonusText"
        ).textContent =
            "Come back tomorrow";

    }

})();


/* =================================================
   MODAL
================================================= */

function openModal(
    title,
    html
){

    document.getElementById(
        "sheet"
    ).innerHTML = `

        <div class="modal-head">

            <h2>
                ${title}
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ✕

            </button>

        </div>

        ${html}

    `;

    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );
}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );
}


/* =================================================
   ADS
================================================= */

function watchAds(){

    openModal(
        "🎬 Watch & Earn",

        `

        <p class="note">
            Complete the viewing step to receive 10 Coins.
        </p>

        <div style="
            height:140px;
            background:#172945;
            border-radius:16px;
            display:grid;
            place-items:center;
            font-size:50px;
            margin-top:15px;
        ">

            ▶️

        </div>

        <button
            class="btn green"
            onclick="
                addCoins(
                    10,
                    'Watched Ad',
                    '🎬'
                );
                closeModal();
            ">

            CLAIM +10 COINS

        </button>

        `
    );
}


/* =================================================
   SPIN WHEEL
================================================= */

function openWheel(){

    openModal(
        "🎡 Spin Wheel",

        `

        <p style="
            color:#9aa8c4;
            text-align:center;
        ">

            10 • 15 • 20 • 100 • 100 Coins

        </p>

        <div class="wheel-area">

            <div class="wheel-box">

                <div class="pointer">
                </div>

                <div
                    id="wheel"
                    class="wheel">
                </div>

            </div>

            <div class="wheel-values">

                <span>10</span>
                <span>15</span>
                <span>20</span>
                <span>100</span>
                <span>100</span>

            </div>

            <div
                id="wheelResult"
                class="status">
            </div>

            <button
                id="spinButton"
                class="btn green"
                onclick="spinWheel()">

                🎡 SPIN NOW

            </button>

        </div>

        `
    );
}


function spinWheel(){

    let rewards =
        [10,15,20,100,100];

    let reward =
        rewards[
            Math.floor(
                Math.random()*5
            )
        ];

    let wheel =
        document.getElementById(
            "wheel"
        );

    wheel.style.transform =
        "rotate(" +
        (
            1440 +
            Math.floor(
                Math.random()*360
            )
        ) +
        "deg)";

    document.getElementById(
        "spinButton"
    ).disabled = true;

    setTimeout(

        function(){

            document.getElementById(
                "wheelResult"
            ).innerHTML = `

                <div class="big-congrats">
                    🎉
                    Congratulations!
                </div>

                <div>
                    You won
                    <b>${reward} Coins</b>
                </div>

            `;

            addCoins(
                reward,
                "Spin Wheel",
                "🎡"
            );

            celebrate();

            document.getElementById(
                "spinButton"
            ).disabled = false;

        },

        4200
    );
}


/* =================================================
   MATH QUESTIONS
================================================= */

const mathQuestions = [

    function(){

        let a =
            Math.floor(
                Math.random()*30
            ) + 10;

        let b =
            Math.floor(
                Math.random()*20
            ) + 5;

        return {
            q:
                a +
                " + " +
                b +
                " = ?",

            answer:
                a+b
        };
    },


    function(){

        let a =
            Math.floor(
                Math.random()*50
            ) + 30;

        let b =
            Math.floor(
                Math.random()*20
            ) + 5;

        return {
            q:
                a +
                " − " +
                b +
                " = ?",

            answer:
                a-b
        };
    },


    function(){

        let a =
            Math.floor(
                Math.random()*10
            ) + 3;

        let b =
            Math.floor(
                Math.random()*8
            ) + 2;

        return {
            q:
                a +
                " × " +
                b +
                " = ?",

            answer:
                a*b
        };
    }

];


/* =================================================
   GK QUESTIONS
================================================= */

const gkQuestions = [

    {
        q:
        "India ki capital kya hai?",

        options:[
            "Mumbai",
            "New Delhi",
            "Kolkata",
            "Chennai"
        ],

        answer:
        "New Delhi"
    },

    {
        q:
        "India ka national animal kya hai?",

        options:[
            "Lion",
            "Tiger",
            "Elephant",
            "Leopard"
        ],

        answer:
        "Tiger"
    },

    {
        q:
        "Taj Mahal kis city me hai?",

        options:[
            "Delhi",
            "Agra",
            "Jaipur",
            "Lucknow"
        ],

        answer:
        "Agra"
    },

    {
        q:
        "Red Planet kise kaha jata hai?",

        options:[
            "Earth",
            "Mars",
            "Venus",
            "Jupiter"
        ],

        answer:
        "Mars"
    },

    {
        q:
        "H2O kya hai?",

        options:[
            "Oxygen",
            "Water",
            "Hydrogen",
            "Salt"
        ],

        answer:
        "Water"

/* =================================================
   QUIZ
================================================= */

function openQuiz(){

    showQuestion();

}


function showQuestion(){

    /*
       Math ke baad GK,
       GK ke baad Math.
    */

    if(
        currentQuizType === "math"
    ){

        let generator =
            mathQuestions[
                Math.floor(
                    Math.random() *
                    mathQuestions.length
                )
            ];

        let data =
            generator();

        currentAnswer =
            data.answer;

        let options = [

            data.answer,

            data.answer + 2,

            data.answer - 3,

            data.answer + 5

        ];

        options.sort(
            () =>
                Math.random() -
                .5
        );

        openModal(

            "🧠 Math Quiz",

            `

            <div class="quiz-type">
                Math Question
            </div>

            <div class="question">
                ${data.q}
            </div>

            <div class="answers">

                ${

                    options
                    .map(

                        option => `

                        <button
                            class="answer"
                            onclick="
                            checkAnswer(
                                this,
                                ${option}
                            )">

                            ${option}

                        </button>

                        `

                    )
                    .join("")

                }

            </div>

            <div
                id="quizStatus"
                class="status">
            </div>

            `

        );

    }

    else{

        let data =
            gkQuestions[
                Math.floor(
                    Math.random() *
                    gkQuestions.length
                )
            ];

        currentAnswer =
            data.answer;

        let options =
            data.options
            .slice();

        options.sort(
            () =>
                Math.random() -
                .5
        );

        openModal(

            "🌍 GK Quiz",

            `

            <div class="quiz-type">
                General Knowledge
            </div>

            <div class="question">
                ${data.q}
            </div>

            <div class="answers">

                ${

                    options
                    .map(

                        option => `

                        <button
                            class="answer"
                            onclick="
                            checkGK(
                                this,
                                '${option.replace(/'/g,"\\'")}'
                            )">

                            ${option}

                        </button>

                        `

                    )
                    .join("")

                }

            </div>

            <div
                id="quizStatus"
                class="status">
            </div>

            `

        );
    }

}


/* =================================================
   MATH ANSWER
================================================= */

function checkAnswer(
    button,
    selected
){

    document
    .querySelectorAll(
        ".answer"
    )
    .forEach(
        x =>
            x.disabled=true
    );

    if(
        selected ===
        currentAnswer
    ){

        button.classList.add(
            "correct"
        );

        correctAnimation();

        addCoins(
            20,
            "Correct Math Answer",
            "🧠"
        );

        setTimeout(

            function(){

                currentQuizType =
                    "gk";

                save();

                showQuestion();

            },

            1700
        );

    }

    else{

        button.classList.add(
            "wrong"
        );

        document.getElementById(
            "quizStatus"
        ).innerHTML = `

            <div style="
                font-size:20px;
            ">

                ❌ Wrong Answer

            </div>

            <div>
                Try Again
            </div>

        `;

        setTimeout(

            function(){

                showQuestion();

            },

            1300
        );
    }
}

function completeTask(
    name,
    amount
){

    let key =
        "completed_" +
        name;

    if(
        localStorage.getItem(key)
    ){

        alert(
            name +
            " task already completed."
        );

        return;
    }

    localStorage.setItem(
        key,
        "1"
    );

    addCoins(
        amount,
        name + " Task",
        "🔥"
    );

    alert(
        "🎉 +" +
        amount +

}

/* =================================================
   WITHDRAW REQUEST
================================================= */

function submitWithdrawal(){

    let upi =
        document.getElementById(
            "upi"
        ).value.trim();

    let amount =
        Number(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    if(
        !/^[\w.-]+@[\w.-]+$/.test(
            upi
        )
    ){

        document.getElementById(
            "withdrawStatus"
        ).innerHTML =

            "❌ Please enter a valid UPI ID";

        return;
    }


    if(
        amount < 1 ||
        amount > coins
    ){

        document.getElementById(
            "withdrawStatus"
        ).innerHTML =

            "❌ Invalid coin amount";

        return;
    }


    coins -= amount;


    history.unshift({

        amount:
            -amount,

        title:
            "Withdrawal • " +
            upi,

        icon:
            "💳",

        time:
            new Date()
            .toLocaleString()

    });


    save();


    document.getElementById(
        "withdrawStatus"
    ).innerHTML = `

        <div style="
            color:#42df8a;
            font-size:18px;
        ">

            ✅ Withdrawal Request Submitted

        </div>

        <div style="
            margin-top:7px;
        ">

            Processing time:

            <b>
                24–72 hours
            </b>

        </div>

    `;

}

================================================= */

function celebrate(){

    let box =
        document.getElementById(
            "confetti"
        );

    box.innerHTML = "";


    for(
        let i=0;
        i<90;
        i++
    ){

        let piece =
            document.createElement(
                "i"
            );

        piece.style.left =
            Math.random()*100 +
            "%";

        piece.style.top =
            "-20px";

        piece.style.background =
            [
                "#ffcf33",
                "#35d889",
                "#4f8cff",
                "#ff536d",
                "#a060ff"
            ][
                i % 5
            ];

        piece.style.animationDelay =
            Math.random()*.4 +
            "s";

        box.appendChild(
            piece
        );
    }


    setTimeout(
        () =>
            box.innerHTML="",
        1800
    );
}
